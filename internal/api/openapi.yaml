openapi: "3.1.0"
info:
  title: Ella SIM OTA API
  version: "1.0.0"
  description: >-
    The API has no authentication: simota listens on the loopback interface unless configured otherwise. Key material
    is write-only: no response holds a key.

servers:
  - url: "{scheme}://{host}"
    variables:
      scheme:
        default: http
        enum: [http, https]
      host:
        default: localhost:5020

tags:
  - name: Cards
  - name: Status
  - name: Specification

paths:
  /api/v1/cards:
    get:
      tags: [Cards]
      operationId: listCards
      summary: List cards
      description: The cards by ICCID.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: A page of cards.
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    type: object
                    required: [items, page, per_page, total_count]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Card"
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_count:
                        type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Cards]
      operationId: createCard
      summary: Create card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardParams"
      responses:
        "201":
          $ref: "#/components/responses/Card"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/cards/import:
    post:
      tags: [Cards]
      operationId: importCards
      summary: Import cards
      description: >-
        Stores the cards of a vendor's key file, such as sysmocom's: a header row, then a row per card, separated by
        tabs or commas. The ICCID, IMSI, KIC<n>, KID<n> and KIK<n> columns are read; Ki, OPc, PINs and ADM keys are
        ignored. A key set without both KIC and KID is left out. A new card gets the TAR b00010 and its first key set;
        an existing card gets the file's IMSI and key sets and keeps its MSISDN, description, TAR and key set choice.
        The import stores all the cards or none.
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
      responses:
        "200":
          description: The number of cards created and updated.
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    type: object
                    required: [created, updated]
                    properties:
                      created:
                        type: integer
                      updated:
                        type: integer
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/cards/{iccid}:
    parameters:
      - $ref: "#/components/parameters/ICCID"
    get:
      tags: [Cards]
      operationId: getCard
      summary: Get card
      responses:
        "200":
          $ref: "#/components/responses/Card"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Cards]
      operationId: updateCard
      summary: Update card
      description: Updates the settings of a card. Its key sets change only by import.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardUpdate"
      responses:
        "200":
          $ref: "#/components/responses/Card"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Cards]
      operationId: deleteCard
      summary: Delete card
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/status:
    get:
      tags: [Status]
      operationId: getStatus
      summary: Get status
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    type: object
                    required: [version]
                    properties:
                      version:
                        type: string

  /api/v1/livez:
    get:
      tags: [Status]
      operationId: livez
      summary: Liveness
      responses:
        "204":
          description: The process serves HTTP.

  /api/v1/readyz:
    get:
      tags: [Status]
      operationId: readyz
      summary: Readiness
      responses:
        "204":
          description: simota serves requests.

  /api/v1/openapi.yaml:
    get:
      tags: [Specification]
      operationId: getOpenAPISpec
      summary: Get this specification
      responses:
        "200":
          description: This document.
          content:
            application/openapi+yaml:
              schema:
                type: string

components:
  parameters:
    ICCID:
      name: iccid
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9]{18,20}$"
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  schemas:
    Card:
      type: object
      required: [iccid, imsi, msisdn, description, tar, kvn, key_sets, created_at, updated_at]
      properties:
        iccid:
          type: string
          examples: ["8949440000001659208"]
        imsi:
          type: string
          examples: ["001010000000001"]
        msisdn:
          type: string
          description: The E.164 number OTA messages go to; empty when unknown.
          examples: ["+15550000001"]
        description:
          type: string
        tar:
          type: string
          description: The Toolkit Application Reference that commands go to, in hexadecimal (ETSI TS 101 220).
          examples: ["b00010"]
        kvn:
          type: integer
          description: The version of the key set that secures commands.
        key_sets:
          type: array
          items:
            $ref: "#/components/schemas/KeySet"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    KeySet:
      type: object
      required: [version, algorithm]
      properties:
        version:
          type: integer
          minimum: 1
          maximum: 15
        algorithm:
          type: string
          enum: [3des, aes]
    KeySetParams:
      allOf:
        - $ref: "#/components/schemas/KeySet"
        - type: object
          required: [kic, kid]
          properties:
            kic:
              type: string
              description: 16 octets for 3des; 16, 24 or 32 for aes; in hexadecimal.
            kid:
              type: string
            kik:
              type: string
              description: Empty when unknown.
    CardUpdate:
      type: object
      required: [imsi, tar, kvn]
      properties:
        imsi:
          type: string
          pattern: "^[0-9]{6,15}$"
        msisdn:
          type: string
        description:
          type: string
        tar:
          type: string
          pattern: "^[0-9a-fA-F]{6}$"
        kvn:
          type: integer
    CardParams:
      allOf:
        - $ref: "#/components/schemas/CardUpdate"
        - type: object
          required: [iccid, key_sets]
          properties:
            iccid:
              type: string
              pattern: "^[0-9]{18,20}$"
            key_sets:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/KeySetParams"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

  responses:
    Card:
      description: A card, without its keys.
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/Card"
    Success:
      description: The change is done.
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such card.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: A card with this ICCID exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
