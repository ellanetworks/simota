openapi: "3.1.0"
info:
  title: Ella SIM OTA API
  version: "1.0.0"
  description: >-
    The API has no authentication: simota listens on the loopback interface unless configured otherwise. Key material
    is write-only: no response holds a key.

servers:
  - url: "{scheme}://{host}"
    variables:
      scheme:
        default: http
        enum: [http, https]
      host:
        default: localhost:5020

tags:
  - name: Cards
  - name: Jobs
  - name: SMSC
  - name: Status
  - name: Specification

paths:
  /api/v1/cards:
    get:
      tags: [Cards]
      operationId: listCards
      summary: List cards
      description: The cards by ICCID.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: A page of cards.
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    type: object
                    required: [items, page, per_page, total_count]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Card"
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_count:
                        type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Cards]
      operationId: createCard
      summary: Create card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardParams"
      responses:
        "201":
          $ref: "#/components/responses/Card"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/cards/import:
    post:
      tags: [Cards]
      operationId: importCards
      summary: Import cards
      description: >-
        Stores the cards of a vendor's key file, such as sysmocom's: a header row, then a row per card, separated by
        tabs or commas. The ICCID, KIC<n> and KID<n> columns are read, and the IMSI column if there is one; Ki, OPc,
        PINs, ADM keys and KIKs are ignored. A key set without both KIC and KID is left out. A key file does not tell the key sets' algorithm,
        which the algorithm parameter gives (ETSI TS 102 225 clauses 5.1.2, 5.1.3). A new card gets the TAR b00001 and
        its first key set; an existing card gets the file's IMSI, if given, and key sets and keeps its MSISDN, description, TAR,
        counters, and key set choice if the file still has that key set. The import stores all the cards or none.
      parameters:
        - name: algorithm
          in: query
          required: true
          schema:
            type: string
            enum: [3des, aes]
        - name: cc_length
          in: query
          description: The length of an AES key set's cryptographic checksums.
          schema:
            type: integer
            enum: [4, 8]
            default: 8
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
      responses:
        "200":
          description: The number of cards created and updated.
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    type: object
                    required: [created, updated]
                    properties:
                      created:
                        type: integer
                      updated:
                        type: integer
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/cards/{iccid}:
    parameters:
      - $ref: "#/components/parameters/ICCID"
    get:
      tags: [Cards]
      operationId: getCard
      summary: Get card
      responses:
        "200":
          $ref: "#/components/responses/Card"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Cards]
      operationId: updateCard
      summary: Update card
      description: Updates the settings of a card. Its key sets change only by import.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardUpdate"
      responses:
        "200":
          $ref: "#/components/responses/Card"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Cards]
      operationId: deleteCard
      summary: Delete card
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/cards/{iccid}/key-sets/{version}:
    put:
      tags: [Cards]
      operationId: updateKeySet
      summary: Set a key set's counter
      description: >-
        Sets the last counter the card accepted with the key set, for a card used before by another sending entity:
        a card does not tell its counter (ETSI TS 102 225 clause 5.1.4). The next command uses one more.
      parameters:
        - $ref: "#/components/parameters/ICCID"
        - name: version
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 15
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [counter]
              properties:
                counter:
                  type: integer
                  minimum: 0
                  maximum: 1099511627775
      responses:
        "200":
          $ref: "#/components/responses/Card"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/jobs:
    post:
      tags: [Jobs]
      operationId: createJobs
      summary: Create jobs
      description: >-
        Queues an operation on the USIM of each card, as a job per card: a read of EF.OPLMNwAcT, or a set or clear of
        one of its slots followed by a read; or an IMSI write to EF.IMSI followed by a read, for one card only. A card
        needs an MSISDN, and may have one job queued or sent at a time. The jobs are created for all the cards or
        none.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobParams"
      responses:
        "201":
          description: The jobs, queued.
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: >-
            A card has a job queued or sent, or the SMSC is not set; or, for an IMSI write, the card has no IMSI on
            record, or previous_imsi is not it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: List jobs
      description: The jobs, newest first.
      parameters:
        - name: search
          in: query
          description: Only the jobs of the cards whose ICCID, IMSI or MSISDN contains this text.
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: A page of jobs.
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    type: object
                    required: [items, page, per_page, total_count]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Job"
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_count:
                        type: integer
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/jobs/{id}:
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Get job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: A job.
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: No such job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/smsc:
    get:
      tags: [SMSC]
      operationId: getSMSC
      summary: Get the SMSC
      description: >-
        The SMSC, such as Ella SMSC, that OTA messages go through over SMPP 3.4, without its password, and the state of simota's
        transceiver bind to it. Unset, the host is empty.
      responses:
        "200":
          $ref: "#/components/responses/SMSC"
    put:
      tags: [SMSC]
      operationId: updateSMSC
      summary: Set the SMSC
      description: >-
        Jobs wait for an SMSC; creating one needs it set. A change of the host, port, TLS, system_id or password
        unbinds the session and binds again with them; the originator and validity apply to the next command of every
        job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SMSCParams"
      responses:
        "200":
          $ref: "#/components/responses/SMSC"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/status:
    get:
      tags: [Status]
      operationId: getStatus
      summary: Get status
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    type: object
                    required: [version]
                    properties:
                      version:
                        type: string

  /api/v1/livez:
    get:
      tags: [Status]
      operationId: livez
      summary: Liveness
      responses:
        "204":
          description: The process serves HTTP.

  /api/v1/readyz:
    get:
      tags: [Status]
      operationId: readyz
      summary: Readiness
      responses:
        "204":
          description: simota serves requests.

  /api/v1/openapi.yaml:
    get:
      tags: [Specification]
      operationId: getOpenAPISpec
      summary: Get this specification
      responses:
        "200":
          description: This document.
          content:
            application/openapi+yaml:
              schema:
                type: string

components:
  parameters:
    ICCID:
      name: iccid
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9]{18,20}$"
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  schemas:
    Card:
      type: object
      required: [iccid, msisdn, description, tar, kvn, key_sets, created_at, updated_at]
      properties:
        iccid:
          type: string
          examples: ["8949440000001659208"]
        imsi:
          type: string
          description: >-
            The IMSI on record, absent when unknown: as set by the operator or an import, or by the last IMSI write
            that succeeded. OTA messages go to the MSISDN.
          examples: ["001010000000001"]
        msisdn:
          type: string
          description: The E.164 number OTA messages go to; empty when unknown.
          examples: ["+15550000001"]
        description:
          type: string
        tar:
          type: string
          description: >-
            The TAR of the card's RFM application whose current directory is ADF.USIM at the start of a script (ETSI TS
            102 226 clause 7.3), in hexadecimal: b00001 or b00020 to b0011f, the ADF range of ETSI TS 101 220 table
            D.1; or b00010 to b0001f, where some cards put it, such as the sysmoISIM-SJA5 at b00011.
          examples: ["b00001"]
        kvn:
          type: integer
          description: The version of the key set that secures commands.
        key_sets:
          type: array
          items:
            $ref: "#/components/schemas/KeySet"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    KeySet:
      type: object
      required: [version, algorithm, cc_length, counter]
      properties:
        version:
          type: integer
          minimum: 1
          maximum: 15
        algorithm:
          type: string
          enum: [3des, aes]
        cc_length:
          type: integer
          enum: [4, 8]
          description: The length of the key set's cryptographic checksums; 4 only for aes (ETSI TS 102 225 clause 5.1.3.1).
        counter:
          type: integer
          description: The last counter sent with the key set. Each command takes the next one (ETSI TS 102 225 clause 5.1.1).
    KeySetParams:
      type: object
      required: [version, algorithm, kic, kid]
      properties:
        version:
          type: integer
          minimum: 1
          maximum: 15
        algorithm:
          type: string
          enum: [3des, aes]
        cc_length:
          type: integer
          enum: [4, 8]
          default: 8
        kic:
          type: string
          description: 16 octets for 3des; 16, 24 or 32 for aes; in hexadecimal.
        kid:
          type: string
    CardUpdate:
      type: object
      required: [tar, kvn]
      properties:
        imsi:
          type: string
          pattern: "^([0-9]{6,15})?$"
          description: >-
            The IMSI the card holds, absent or empty when unknown. An IMSI write needs it, as the IMSI it replaces.
        msisdn:
          type: string
        description:
          type: string
        tar:
          type: string
          pattern: "^[bB]0(00(01|[1-9a-fA-F][0-9a-fA-F])|01[01][0-9a-fA-F])$"
        kvn:
          type: integer
    CardParams:
      allOf:
        - $ref: "#/components/schemas/CardUpdate"
        - type: object
          required: [iccid, key_sets]
          properties:
            iccid:
              type: string
              pattern: "^[0-9]{18,20}[fF]?$"
              description: A trailing F, the padding of an odd number of digits, is dropped.
            key_sets:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/KeySetParams"
    AccessTechnology:
      type: string
      enum: [utran, eutran_wb_s1, eutran_nb_s1, ngran, satellite_ngran, satellite_eutran_wb_s1, satellite_eutran_nb_s1,
        gsm, ec_gsm_iot, gsm_compact, cdma2000_hrpd, cdma2000_1xrtt]
      description: >-
        An access technology of a PLMN selector entry (3GPP TS 31.102 clause 4.2.5, tables 4.2.5.1 and 4.2.5.2).
    JobParams:
      type: object
      required: [iccids, operation]
      properties:
        iccids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
        operation:
          type: string
          enum: [oplmn_read, oplmn_set, oplmn_clear, imsi_write]
          description: >-
            imsi_write writes imsi to the card's EF.IMSI (3GPP TS 31.102 clause 4.2.2) and reads it back. A wrong IMSI
            cuts the card off the network, and with it off OTA: provision imsi in the core first, with the card's keys
            and MSISDN, and with an MNC of the length that the card's EF.AD tells (3GPP TS 31.102 clause 4.2.18), which
            the job does not change. The card uses the new IMSI from its next USIM initialisation, when the device
            restarts: simota sends no REFRESH.
        slot:
          type: integer
          minimum: 1
          maximum: 51
          description: The entry, from 1, that a set or clear writes.
        mcc:
          type: string
          pattern: "^[0-9]{3}$"
          description: The MCC of a set.
        mnc:
          type: string
          pattern: "^[0-9]{2,3}$"
          description: The MNC of a set.
        access:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AccessTechnology"
          description: The access technologies of a set.
        imsi:
          type: string
          pattern: "^[0-9]{6,15}$"
          description: >-
            The IMSI an IMSI write writes: an MCC of 3 digits, an MNC of 2 or 3, and the MSIN, at most 15 digits (3GPP
            TS 23.003 clause 2.2). An IMSI write takes one card.
          examples: ["001010000000002"]
        previous_imsi:
          type: string
          pattern: "^[0-9]{6,15}$"
          description: >-
            The IMSI an IMSI write replaces, which must be the card's IMSI on record: it confirms which card and
            subscription the write is meant for. A card without an IMSI on record needs it set first.
          examples: ["001010000000001"]
    Entry:
      type: object
      required: [slot]
      properties:
        slot:
          type: integer
        mcc:
          type: string
          description: Absent for an unused entry.
        mnc:
          type: string
        access:
          type: array
          items:
            $ref: "#/components/schemas/AccessTechnology"
        access_raw:
          type: string
          description: The Access Technology Identifier, in hexadecimal.
    Job:
      type: object
      required: [id, iccid, operation, status, created_at, updated_at]
      properties:
        id:
          type: integer
        iccid:
          type: string
        operation:
          type: string
          enum: [oplmn_read, oplmn_set, oplmn_clear, imsi_write]
        slot:
          type: integer
        mcc:
          type: string
        mnc:
          type: string
        access:
          type: array
          items:
            $ref: "#/components/schemas/AccessTechnology"
        access_raw:
          type: string
        imsi:
          type: string
          description: The IMSI an IMSI write writes.
        previous_imsi:
          type: string
          description: >-
            The card's IMSI on record that an IMSI write replaces. The card's IMSI on record becomes imsi when the
            write succeeds, and stays previous_imsi otherwise: an unconfirmed write may or may not have taken effect.
        imsi_read_back:
          type: string
          description: The IMSI that EF.IMSI read back after an IMSI write, even one that differs from imsi.
        tar:
          type: string
          description: The TAR the job's commands go to.
        kvn:
          type: integer
          description: The version of the key set that secures the job's commands.
        status:
          type: string
          enum: [queued, sent, succeeded, unconfirmed, failed]
          description: >-
            A job runs as one or more commands, each a short message: a set, a clear or an IMSI write writes and reads
            back what it wrote; a read gets the file's size, then reads it in chunks that fit a PoR. queued until simota
            submits the next command to the SMSC, sent until the SMSC forwards the card's answer or its delivery
            receipt. succeeded when every PoR and status word is good and a write reads back what it wrote: the file is
            written on the card; the UE uses it after its next USIM initialisation or a REFRESH (ETSI TS 102 226 clause
            4). unconfirmed when a write may have taken effect without a PoR that tells, such as one the card sends
            later by SMS-SUBMIT.
            failed otherwise. A job closed by a delivery receipt or by the deadline, without a PoR, takes the outcome of
            a PoR that comes later with its last command's TAR and counter; a read stays failed when that PoR is to
            one of its steps but the last, and is to be run again.
        step:
          type: integer
          description: The index of the job's current command.
        file_size:
          type: integer
          description: The size of EF.OPLMNwAcT, once a read has it.
        counter:
          type: integer
          description: The counter of the current command.
        warning:
          type: boolean
          description: The last status word completed with a warning (ETSI TS 102 221 table 10.9).
        message_id:
          type: string
          description: The message_id that the SMSC gave the current command's submit_sm (SMPP 3.4 section 4.4.2).
        por_status:
          type: string
          description: The Response Status Code of the card's PoR (ETSI TS 102 225 clause 5.2.2), such as por_ok.
        status_word:
          type: string
          description: The status word of the script's last command, in hexadecimal, such as 9000.
        entries:
          type: array
          description: >-
            The entries the job read: EF.OPLMNwAcT for a read, the slot read back for a set or a clear.
          items:
            $ref: "#/components/schemas/Entry"
        command:
          type: string
          description: The TP-UDH and TP-UD of the Command Packet, in hexadecimal.
        response:
          type: string
          description: The TP-UDH and TP-UD of the Response Packet, in hexadecimal.
        error:
          type: string
          description: Why the job failed or is unconfirmed.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SMSC:
      type: object
      required: [host, port, tls, system_id, originator, validity_seconds, password_set, bind]
      properties:
        host:
          type: string
          description: The host name or IP address of the SMSC's SMPP listener.
          examples: ["127.0.0.1"]
        port:
          type: integer
          description: Its port, 2775 by default.
        tls:
          type: boolean
          description: The connection is over TLS, checked against the system's roots.
        system_id:
          type: string
          description: The system_id of simota's ESME account on the SMSC (SMPP 3.4 section 5.2.1).
        originator:
          type: string
          description: The E.164 address the OTA messages come from.
        validity_seconds:
          type: integer
          description: How long the SMSC attempts delivery of an OTA message.
        password_set:
          type: boolean
          description: A password is set. The password is write-only.
        bind:
          $ref: "#/components/schemas/BindState"
    BindState:
      type: object
      required: [status, since]
      description: simota's SMPP session to the SMSC, one transceiver bind, bound again whenever it is lost.
      properties:
        status:
          type: string
          enum: [unset, connecting, bound, disconnected]
          description: unset while no SMSC is set; disconnected between a failure and the next attempt.
        since:
          type: string
          format: date-time
          description: When the session entered its status.
        smsc_system_id:
          type: string
          description: The SMSC's system_id, while bound.
        last_error:
          type: string
          description: The last failure to connect, to bind, or of the session, such as a refused bind.
          examples: ["smpp: bind refused: smpp: bind_transceiver_resp ESME_RBINDFAIL"]
        last_error_at:
          type: string
          format: date-time
    SMSCParams:
      type: object
      required: [host, system_id, originator, validity_seconds]
      properties:
        host:
          type: string
          description: A host name or an IP address, without a port.
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 2775
        tls:
          type: boolean
          default: false
        system_id:
          type: string
          minLength: 1
          maxLength: 15
          description: Printable ASCII (SMPP 3.4 section 4.1.1, table 4-1).
        password:
          type: string
          maxLength: 8
          description: >-
            The ESME account's password, printable ASCII (SMPP 3.4 section 4.1.1, table 4-1). Required the first time;
            absent or empty keeps the password set.
        originator:
          type: string
        validity_seconds:
          type: integer
          minimum: 1
          maximum: 8553600
          description: >-
            At most 99 days: simota sends the validity_period as a relative time, whose days field has two digits
            (SMPP 3.4 section 7.1.1.2). The SMSC may impose a lower limit.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

  responses:
    SMSC:
      description: The SMSC, without its password, and the bind state.
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/SMSC"
    Card:
      description: A card, without its keys.
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                $ref: "#/components/schemas/Card"
    Success:
      description: The change is done.
      content:
        application/json:
          schema:
            type: object
            required: [result]
            properties:
              result:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such card.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: A card with this ICCID exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
