name: simota
base: bare
build-base: ubuntu@26.04
adopt-info: simota-release-data
summary: simota is a minimal SIM OTA platform.
description: |
 simota is a minimal SIM OTA platform. It runs Remote File Management jobs on SIM cards as secured packets, sent
 through any SMSC as an SMPP 3.4 client.
platforms:
  amd64:
  arm64:

services:
  simota:
    override: replace
    summary: simota is a minimal SIM OTA platform.
    command: simota -config /simota.yaml
    startup: enabled
    on-failure: restart

parts:
  simota:
    plugin: go
    source: .
    source-type: local
    build-snaps:
      - go/1.26/stable
      - node/24/stable
    stage-packages:
      - libc6_libs
    override-build: |
      npm ci --prefix ui
      npm run build --prefix ui
      go build -v -o ${CRAFT_PART_INSTALL}/bin/simota -ldflags "-s -w" ./cmd/simota

  simota-release-data:
    plugin: nil
    source: .
    override-build: |
      version="$(sed -n 's/^\tversion = "v\(.*\)"$/\1/p' cmd/simota/main.go)"
      craftctl set version="$version"
