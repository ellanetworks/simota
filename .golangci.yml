version: "2"
linters:
  enable:
    - asciicheck
    - bodyclose
    - dogsled
    - godox
    - gomodguard
    - misspell
    - nakedret
    - noctx
    - predeclared
    - staticcheck
    - unconvert
    - unparam
    - whitespace
    - govet
    - wsl_v5
    - sloglint
  settings:
    sloglint:
      # A record carries the trace context of its context: log with one wherever one is in scope.
      context: scope
      attr-only: true
issues:
  new-from-rev: ""
  new: false
severity:
  default: error
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
