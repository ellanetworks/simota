# The manifests of k8s as the smoke test deploys them, in a namespace that
# enforces the restricted Pod Security Standard, with the image it loads.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - ../../k8s
images:
  - name: ghcr.io/ellanetworks/simota
    newName: simota
    newTag: ci
