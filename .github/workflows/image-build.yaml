name: Image Build

permissions:
  contents: read

on:
  workflow_call:

jobs:
  build-image:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ (matrix.arch == 'arm64' && 'ubuntu-26.04-arm') || 'ubuntu-26.04' }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: canonical/craft-actions/rockcraft/pack@fab598d0bc394eb086cb4767dcc898b25aa8e9fa # main
        id: rockcraft
        with:
          channel: stable

      - name: Save container image to file
        run: |
          rock_file=$(ls *.rock | tail -n 1)
          sudo rockcraft.skopeo --insecure-policy copy oci-archive:"${rock_file}" docker-daemon:simota:latest
          docker save -o simota_latest-${{ matrix.arch }}.tar simota:latest

      - name: Upload container image to GitHub Artifact
        uses: actions/upload-artifact@v7
        with:
          name: simota-image-${{ matrix.arch }}
          path: simota_latest-${{ matrix.arch }}.tar
