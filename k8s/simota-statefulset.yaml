apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: simota
spec:
  replicas: 1
  serviceName: simota
  selector:
    matchLabels:
      app: simota
  template:
    metadata:
      labels:
        app: simota
    spec:
      automountServiceAccountToken: false
      # simota stops in up to 75 seconds: 5 for the API's requests, 60 for the job being sent, 5 to unbind and 5 to
      # export the last spans.
      terminationGracePeriodSeconds: 80
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: simota
        image: ghcr.io/ellanetworks/simota:latest
        command: ["simota"]
        args: ["-config", "/config/simota.yaml"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - name: http
          containerPort: 5020
        readinessProbe:
          httpGet:
            path: /api/v1/readyz
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /api/v1/livez
            port: http
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: config-volume
          mountPath: /config
          readOnly: true
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config-volume
        configMap:
          name: simota-config
      - name: tmp
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
